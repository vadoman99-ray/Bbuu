
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMC 永續合約訊號掃描器</title>
  <style>
    :root {
      --bg-color: #121418;
      --card-bg: #1e222d;
      --text-color: #d1d4dc;
      --accent-green: #0ecb81;
      --accent-red: #f6465d;
      --border-color: #2a2e39;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
    }
    h1 { margin: 0; font-size: 1.5rem; color: #fff; }
    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
    }
    select, button {
      background: var(--card-bg);
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent-green); }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }
    th { background: #161a25; color: #848e9c; font-weight: 600; }
    tr:hover { background: #262b3e; }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      display: inline-block;
    }
    .badge-bull { background: rgba(14, 203, 129, 0.15); color: var(--accent-green); }
    .badge-bear { background: rgba(246, 70, 93, 0.15); color: var(--accent-red); }
    .status { font-size: 0.9rem; color: #848e9c; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>⚡ SMC 永續合約即時掃描器</h1>
    <div class="controls">
      <label>K線週期：
        <select id="timeframe">
          <option value="15m" selected>15 分鐘</option>
          <option value="1h">1 小時</option>
          <option value="4h">4 小時</option>
        </select>
      </label>
      <button onclick="startScan()">🚀 開始掃描</button>
    </div>
  </header>

  <div style="margin-bottom: 10px;" class="status" id="statusText">點擊「開始掃描」以獲取幣安 USDT 永續合約數據...</div>

  <table>
    <thead>
      <tr>
        <th>幣種名稱</th>
        <th>當前價格</th>
        <th>偵測訊號型態</th>
        <th>方向</th>
        <th>參考觀察區間</th>
      </tr>
    </thead>
    <tbody id="resultBody">
      <tr><td colspan="5" style="text-align: center; color: #848e9c;">暫無數據</td></tr>
    </tbody>
  </table>
</div>

<script>
  // 取得幣安 USDT 永續合約成交量前 30 名幣種
  async function getTopSymbols() {
    const res = await fetch('https://fapi.binance.com/fapi/1/ticker/24hr');
    const data = await res.json();
    return data
      .filter(item => item.symbol.endsWith('USDT'))
      .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
      .slice(0, 30)
      .map(item => item.symbol);
  }

  // 取得指定幣種的 K線數據
  async function getKlines(symbol, interval) {
    const res = await fetch(`https://fapi.binance.com/fapi/1/klines?symbol=${symbol}&interval=${interval}&limit=20`);
    const data = await res.json();
    return data.map(k => ({
      high: parseFloat(k[2]),
      low: parseFloat(k[3]),
      close: parseFloat(k[4]),
      open: parseFloat(k[1])
    }));
  }

  // SMC 策略邏輯判斷
  function analyzePattern(klines) {
    const len = klines.length;
    if (len < 5) return null;

    const k1 = klines[len - 3];
    const k2 = klines[len - 2];
    const k3 = klines[len - 1]; // 當前/剛收盤 K線

    // 1. 檢測 FVG 缺口 (第6招)
    // 看多 FVG: K1 的最高價 < K3 的最低價
    if (k1.high < k3.low) {
      return { pattern: 'FVG 價格缺口', type: '看多 (Bullish)', range: `${k1.high} - ${k3.low}` };
    }
    // 看空 FVG: K1 的最低價 > K3 的最高價
    if (k1.low > k3.high) {
      return { pattern: 'FVG 價格缺口', type: '看空 (Bearish)', range: `${k3.high} - ${k1.low}` };
    }

    // 2. 檢測流動性掠奪/假突破 (第1、2招)
    const prevHigh = Math.max(...klines.slice(len - 10, len - 2).map(k => k.high));
    const prevLow = Math.min(...klines.slice(len - 10, len - 2).map(k => k.low));

    // 掃高反轉看空：最高價突破前高，但收盤價收回前高下方
    if (k2.high > prevHigh && k2.close < prevHigh) {
      return { pattern: '假突破掠奪 (Sweep)', type: '看空 (Bearish)', range: `掃蕩點: ${k2.high}` };
    }
    // 掃低反轉看多：最低價跌破前低，但收盤價收回前高上方
    if (k2.low < prevLow && k2.close > prevLow) {
      return { pattern: '假突破掠奪 (Sweep)', type: '看多 (Bullish)', range: `掃蕩點: ${k2.low}` };
    }

    return null;
  }

  // 執行掃描程序
  async function startScan() {
    const timeframe = document.getElementById('timeframe').value;
    const statusText = document.getElementById('statusText');
    const tbody = document.getElementById('resultBody');

    statusText.innerText = '正在抓取幣安數據與進行 SMC 演算法分析中...';
    tbody.innerHTML = '';

    try {
      const symbols = await getTopSymbols();
      let foundCount = 0;

      for (let symbol of symbols) {
        const klines = await getKlines(symbol, timeframe);
        const signal = analyzePattern(klines);

        if (signal) {
          foundCount++;
          const currentPrice = klines[klines.length - 1].close;
          const isBull = signal.type.includes('看多');
          
          const row = `
            <tr>
              <td><strong>${symbol}</strong></td>
              <td>${currentPrice}</td>
              <td>${signal.pattern}</td>
              <td><span class="badge ${isBull ? 'badge-bull' : 'badge-bear'}">${signal.type}</span></td>
              <td>${signal.range}</td>
            </tr>
          `;
          tbody.innerHTML += row;
        }
      }

      if (foundCount === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #848e9c;">當前時框未發現符合 SMC 型態的熱門幣種</td></tr>';
      }
      statusText.innerText = `掃描完成！共分析 30 個熱門永續合約幣種，發現 ${foundCount} 個潛在交易機會。`;

    } catch (err) {
      console.error(err);
      statusText.innerText = '掃描失敗，請確認網路連線或 API 是否受到限制。';
    }
  }
</script>

</body>
</html>
