<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMC 專業市場掃描器 (全功能恢復版)</title>
    <style>
        :root {
            --bg: #0b0e14; --card: #151921; --border: #262c36;
            --text: #e1e7ed; --muted: #788596;
            --green: #00c076; --red: #ff5353; --blue: #388bfd; --purple: #a371f7;
            --font-mono: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
            --font-main: system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: var(--font-main); font-size: 13px; padding: 12px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        h1 { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }

        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 12px; }
        .flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        
        input, select, button { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: 4px; outline: none; font-family: var(--font-main); }
        button { background: #238636; color: #fff; border: none; cursor: pointer; font-weight: 600; }
        button:hover { background: var(--green); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .main-grid { display: grid; grid-template-columns: 500px 1fr; gap: 12px; }
        @media (max-width: 960px) { .main-grid { grid-template-columns: 1fr; } }

        .table-box { max-height: 520px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        th { background: var(--card); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; position: sticky; top: 0; z-index: 2; }
        
        .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
        
        tr:hover { background: rgba(255,255,255,0.03); cursor: pointer; }
        tr.active { background: rgba(56,139,253,0.12); }

        .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: 700; font-family: var(--font-mono); text-align: center; }
        .bg-long { background: rgba(0,192,118,0.15); color: var(--green); border: 1px solid rgba(0,192,118,0.3); }
        .bg-short { background: rgba(255,83,83,0.15); color: var(--red); border: 1px solid rgba(255,83,83,0.3); }
        .bg-tag { background: rgba(163,113,247,0.15); color: var(--purple); border: 1px solid rgba(163,113,247,0.3); }

        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .metric { background: var(--bg); padding: 10px; border-radius: 5px; border: 1px solid var(--border); }
        .metric-title { font-size: 11px; color: var(--muted); }
        .metric-val { font-size: 15px; font-weight: 700; font-family: var(--font-mono); color: #fff; margin-top: 4px; }

        .log-box { font-family: var(--font-mono); font-size: 11px; background: #05070a; padding: 8px 12px; border-radius: 4px; height: 120px; overflow-y: auto; color: var(--muted); border: 1px solid var(--border); }
        .progress { height: 3px; background: var(--blue); width: 0%; transition: width 0.1s; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ SMC 市場掃描器 <span style="font-size:12px; color:var(--muted); font-weight:normal;">(恢復全功能版)</span></h1>
        <span id="updateTime" class="num" style="color:var(--muted); font-size:11px;">準備就緒</span>
    </header>

    <div class="panel flex" style="background: rgba(56,139,253,0.05);">
        <span style="color:var(--blue); font-weight:bold;">🤖 TG 自動警報:</span>
        <input type="password" id="tgToken" placeholder="Bot Token" style="width: 200px;" onchange="saveTg()">
        <input type="text" id="tgChatId" placeholder="Chat ID" style="width: 130px;" onchange="saveTg()">
        <button onclick="testTg()" style="background:#1f6feb;">✈️ 測試推播</button>
    </div>

    <div class="panel flex">
        <label style="color:var(--muted)">成交量過濾:</label>
        <select id="volFilter" onchange="scanMarket()">
            <option value="100000000" selected>≥ 1 億 USDT</option>
            <option value="50000000">≥ 5,000 萬 USDT</option>
            <option value="500000000">≥ 5 億 USDT</option>
            <option value="0">全部幣種 (無視量)</option>
        </select>

        <label style="color:var(--muted); margin-left:8px;">戰法:</label>
        <select id="stratFilter" onchange="renderTable()">
            <option value="ALL">全部戰法</option>
            <option value="SFP">SFP 假突破</option>
            <option value="FVG">FVG 缺口</option>
        </select>

        <button id="scanBtn" onclick="scanMarket()" style="margin-left:auto;">🚀 開始極速掃描</button>
    </div>
    <div style="margin-bottom: 12px;"><div id="progBar" class="progress"></div></div>

    <div class="main-grid">
        <div class="panel" style="padding:0;">
            <div style="padding:10px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
                <b>🔥 符合條件標的</b>
                <span id="sigCount" class="badge bg-tag">0 個</span>
            </div>
            <div class="table-box">
                <table>
                    <thead>
                        <tr>
                            <th style="width:25%">幣種</th>
                            <th style="width:22%" class="num">即時價格</th>
                            <th style="width:23%" class="num">24h 成交量</th>
                            <th style="width:15%">戰法</th>
                            <th style="width:15%; text-align:center;">方向</th>
                        </tr>
                    </thead>
                    <tbody id="listBody"></tbody>
                </table>
            </div>
        </div>

        <div class="panel flex" style="flex-direction:column; align-items:stretch; gap:10px;">
            <div class="grid-4">
                <div class="metric"><div class="metric-title">當前標的</div><div class="metric-val" id="mSymbol">--</div></div>
                <div class="metric"><div class="metric-title">即時價格</div><div class="metric-val" id="mPrice">0.0000</div></div>
                <div class="metric"><div class="metric-title">機構戰法</div><div class="metric-val" id="mStrat" style="color:var(--purple)">--</div></div>
                <div class="metric"><div class="metric-title">建議止損位</div><div class="metric-val" id="mSL" style="color:var(--red)">--</div></div>
            </div>

            <div class="panel flex" style="background:var(--bg); margin:0;">
                <label style="color:var(--muted)">本金 ($):</label>
                <input type="number" id="balance" class="num" value="1000" style="width:80px;" oninput="calcRisk()">
                <label style="color:var(--muted)">風險 (%):</label>
                <input type="number" id="risk" class="num" value="2" style="width:50px;" oninput="calcRisk()">
                <label style="color:var(--muted)">槓桿:</label>
                <input type="number" id="lev" class="num" value="10" style="width:50px;" oninput="calcRisk()">
                <div style="margin-left:auto; text-align:right;">
                    <span style="color:var(--muted); font-size:11px;">建議倉位名義價值:</span>
                    <b id="posVal" class="num" style="color:var(--green); font-size:15px; margin-left:6px;">$0.00</b>
                </div>
            </div>

            <div class="log-box" id="logBox"></div>
        </div>
    </div>

    <script>
        let signals = {}, curItem = null, isScanning = false, tgHistory = new Set();

        window.onload = () => {
            document.getElementById("tgToken").value = localStorage.getItem("SMC_TG_TK") || "";
            document.getElementById("tgChatId").value = localStorage.getItem("SMC_TG_CID") || "";
            scanMarket();
            setInterval(pollPrices, 5000);
        };

        function saveTg() {
            localStorage.setItem("SMC_TG_TK", document.getElementById("tgToken").value.trim());
            localStorage.setItem("SMC_TG_CID", document.getElementById("tgChatId").value.trim());
        }

        async function sendTg(msg) {
            const tk = localStorage.getItem("SMC_TG_TK"), cid = localStorage.getItem("SMC_TG_CID");
            if (!tk || !cid) return false;
            try {
                const res = await fetch(`https://api.telegram.org/bot${tk}/sendMessage`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_id: cid, text: msg, parse_mode: "HTML" })
                });
                return (await res.json()).ok;
            } catch (e) { return false; }
        }

        async function testTg() {
            saveTg();
            if (await sendTg("🟢 <b>[SMC 測試] Telegram 警報系統正常運作中！</b>")) alert("發送成功！");
            else alert("發送失敗，請確認 Token 與 Chat ID。");
        }

        function formatVol(v) {
            if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
            if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
            return (v / 1e3).toFixed(0) + 'K';
        }

        async function scanMarket() {
            if (isScanning) return;
            isScanning = true;
            const btn = document.getElementById("scanBtn"), pBar = document.getElementById("progBar");
            const minVol = +document.getElementById("volFilter").value;
            btn.disabled = true; signals = {}; renderTable();
            log(`🌐 開始掃描幣安永續合約 (過濾 24h 量 ≥ ${formatVol(minVol)})...`);

            try {
                const tRes = await fetch("https://fapi.binance.com/fapi/v1/ticker/24hr");
                const tData = await tRes.json();
                
                const qualified = tData.filter(t => 
                    t.symbol.endsWith("USDT") && 
                    +t.quoteVolume >= minVol
                ).sort((a,b) => +b.quoteVolume - +a.quoteVolume);

                log(`🎯 符合成交量條件標的共 ${qualified.length} 個，開始 SMC 分析...`);

                const batchSize = 15;
                for (let i = 0; i < qualified.length; i += batchSize) {
                    const chunk = qualified.slice(i, i + batchSize);
                    await Promise.all(chunk.map(async (item) => {
                        const sym = item.symbol;
                        try {
                            const res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${sym}&interval=15m&limit=30`);
                            if (!res.ok) return;
                            const klines = (await res.json()).map(k => ({ high: +k[2], low: +k[3], close: +k[4] }));
                            const smc = detectSMC(klines);
                            if (smc) {
                                const price = klines[klines.length - 1].close;
                                const vol = +item.quoteVolume;
                                signals[sym] = { sym, price, vol, ...smc };
                                checkAndSendTg(sym, smc, price, vol);
                            }
                        } catch(e){}
                    }));
                    pBar.style.width = `${Math.floor(((i + batchSize) / qualified.length) * 100)}%`;
                    renderTable();
                    await new Promise(r => setTimeout(r, 30));
                }
                log(`🎉 掃描完成！共發現 ${Object.keys(signals).length} 個 SMC 觸發訊號。`);
            } catch(e) { log(`❌ 掃描出錯: ${e.message}`); }

            isScanning = false; btn.disabled = false; pBar.style.width = "0%";
            updateTime();
        }

        function detectSMC(klines) {
            const len = klines.length;
            if (len < 10) return null;
            const curr = klines[len - 1];
            const prev = klines.slice(len - 25, len - 2);
            const hi = Math.max(...prev.map(k => k.high)), lo = Math.min(...prev.map(k => k.low));

            if (curr.high > hi && curr.close < hi) return { code: "SFP", name: "SFP 看跌假突破", dir: "SHORT", sl: +(curr.high * 1.0015).toFixed(4) };
            if (curr.low < lo && curr.close > lo) return { code: "SFP", name: "SFP 看漲假突破", dir: "LONG", sl: +(curr.low * 0.9985).toFixed(4) };

            const k1 = klines[len - 3], k3 = klines[len - 1];
            if (k1.high < k3.low) return { code: "FVG", name: "FVG 看漲缺口", dir: "LONG", sl: +(k1.high * 0.998).toFixed(4) };
            if (k1.low > k3.high) return { code: "FVG", name: "FVG 看跌缺口", dir: "SHORT", sl: +(k1.low * 1.002).toFixed(4) };

            return null;
        }

        function checkAndSendTg(sym, smc, price, vol) {
            const key = `${sym}_${smc.code}_${smc.dir}`;
            if (tgHistory.has(key)) return;
            tgHistory.add(key);

            const msg = `🎯 <b>[SMC 訊號觸發]</b>\n\n📌 <b>標的</b>: <code>${sym}</code>\n📊 <b>24h量</b>: $${formatVol(vol)}\n⚡ <b>戰法</b>: ${smc.name}\n📈 <b>方向</b>: ${smc.dir}\n💵 <b>價格</b>: $${price}\n🛡️ <b>止損</b>: $${smc.sl}`;
            sendTg(msg);
        }

        async function pollPrices() {
            const keys = Object.keys(signals);
            if (keys.length === 0 || isScanning) return;
            try {
                const res = await fetch("https://fapi.binance.com/fapi/v1/ticker/price");
                if (!res.ok) return;
                const pData = await res.json();
                const pMap = {};
                pData.forEach(p => pMap[p.symbol] = +p.price);

                keys.forEach(sym => {
                    if (pMap[sym]) {
                        signals[sym].price = pMap[sym];
                        if (curItem && curItem.sym === sym) {
                            curItem.price = pMap[sym];
                            document.getElementById("mPrice").innerText = pMap[sym].toFixed(4);
                            calcRisk();
                        }
                    }
                });
                renderTable();
                updateTime();
            } catch(e){}
        }

        function renderTable() {
            const filter = document.getElementById("stratFilter").value;
            const tbody = document.getElementById("listBody");
            tbody.innerHTML = "";
            let count = 0;

            Object.values(signals).forEach(item => {
                if (filter !== "ALL" && item.code !== filter) return;
                count++;
                const tr = document.createElement("tr");
                if (curItem && curItem.sym === item.sym) tr.className = "active";
                tr.onclick = () => selectItem(item);

                const bg = item.dir === "LONG" ? "bg-long" : "bg-short";
                tr.innerHTML = `
                    <td><b>${item.sym}</b></td>
                    <td class="num">$${item.price.toFixed(4)}</td>
                    <td class="num" style="color:var(--muted)">$${formatVol(item.vol)}</td>
                    <td><span class="badge bg-tag">${item.code}</span></td>
                    <td style="text-align:center;"><span class="badge ${bg}">${item.dir}</span></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById("sigCount").innerText = `${count} 個`;
            if (count > 0 && !curItem) selectItem(Object.values(signals)[0]);
        }

        function selectItem(item) {
            curItem = item;
            document.getElementById("mSymbol").innerText = item.sym;
            document.getElementById("mPrice").innerText = item.price.toFixed(4);
            document.getElementById("mStrat").innerText = `${item.code} (${item.dir})`;
            document.getElementById("mSL").innerText = item.sl.toFixed(4);
            renderTable();
            calcRisk();
        }

        function calcRisk() {
            if (!curItem) return;
            const bal = +document.getElementById("balance").value || 0;
            const risk = +document.getElementById("risk").value || 0;
            const diff = Math.abs(curItem.price - curItem.sl);
            if (diff > 0) {
                const pos = (bal * (risk / 100)) / (diff / curItem.price);
                document.getElementById("posVal").innerText = `$${pos.toFixed(2)}`;
            }
        }

        function log(m) {
            const box = document.getElementById("logBox");
            box.innerHTML = `<div>[${new Date().toTimeString().split(' ')[0]}] ${m}</div>` + box.innerHTML;
        }

        function updateTime() {
            document.getElementById("updateTime").innerText = `最後更新: ${new Date().toTimeString().split(' ')[0]}`;
        }
    </script>
</body>
</html>
