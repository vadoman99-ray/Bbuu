<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Binance 多週期即時 K 線圖展出</title>
    <!-- 引入 TradingView 開源 Lightweight Charts 圖表庫 -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; padding: 10px; }
        h1 { text-align: center; margin-bottom: 10px; font-size: 20px; color: #f0b90b; }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            height: calc(100vh - 50px);
        }
        .chart-card {
            background-color: #1e1e1e;
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            border: 1px solid #2a2e39;
        }
        .chart-title { font-weight: bold; font-size: 14px; margin-bottom: 6px; color: #d1d4dc; }
        .chart-body { flex: 1; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <h1>ETHUSDT 多週期即時 K 線圖面板</h1>

    <div class="grid-container">
        <div class="chart-card">
            <div class="chart-title">日線 (1D)</div>
            <div id="chart-1d" class="chart-body"></div>
        </div>
        <div class="chart-card">
            <div class="chart-title">4小時線 (4H)</div>
            <div id="chart-4h" class="chart-body"></div>
        </div>
        <div class="chart-card">
            <div class="chart-title">1小時線 (1H)</div>
            <div id="chart-1h" class="chart-body"></div>
        </div>
        <div class="chart-card">
            <div class="chart-title">15分鐘線 (15M)</div>
            <div id="chart-15m" class="chart-body"></div>
        </div>
    </div>

    <script>
        const symbol = 'ETHUSDT';
        const configs = [
            { containerId: 'chart-1d', interval: '1d', limit: 100 },
            { containerId: 'chart-4h', interval: '4h', limit: 100 },
            { containerId: 'chart-1h', interval: '1h', limit: 100 },
            { containerId: 'chart-15m', interval: '15m', limit: 100 }
        ];

        async function fetchKlines(interval, limit) {
            const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
            const response = await fetch(url);
            const data = await response.json();
            return data.map(d => ({
                time: d[0] / 1000, // 轉為 Unix 秒級時間戳
                open: parseFloat(d[1]),
                high: parseFloat(d[2]),
                low: parseFloat(d[3]),
                close: parseFloat(d[4])
            }));
        }

        async function initCharts() {
            for (const cfg of configs) {
                const container = document.getElementById(cfg.containerId);
                
                // 建立 TradingView 圖表實例
                const chart = LightweightCharts.createChart(container, {
                    layout: { backgroundColor: '#1e1e1e', textColor: '#d1d4dc' },
                    grid: { vertLines: { color: '#2b2b43' }, horzLines: { color: '#2b2b43' } },
                    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                    timeScale: { timeVisible: true, secondsVisible: false }
                });

                // 新增 Candlestick 系列
                const candlestickSeries = chart.addCandlestickSeries({
                    upColor: '#ef5350',
                    downColor: '#26a69a',
                    borderVisible: false,
                    wickUpColor: '#ef5350',
                    wickDownColor: '#26a69a'
                });

                // 載入 Binance 歷史 K 線數據
                const candleData = await fetchKlines(cfg.interval, cfg.limit);
                candlestickSeries.setData(candleData);

                // 自動縮放與響應式調整
                chart.timeScale().fitContent();
                new ResizeObserver(() => {
                    chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
                }).observe(container);

                // 設定每 10 秒向 Binance 抓取最新 K 線刷新
                setInterval(async () => {
                    const latestData = await fetchKlines(cfg.interval, 2);
                    latestData.forEach(candle => candlestickSeries.update(candle));
                }, 10000);
            }
        }

        initCharts();
    </script>
</body>
</html>
