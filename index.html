<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMC 永續合約掃描器 (WebSocket極速版)</title>
  <style>
    :root {
      --bg-color: #121418;
      --card-bg: #1e222d;
      --text-color: #d1d4dc;
      --accent-green: #0ecb81;
      --accent-red: #f6465d;
      --border-color: #2a2e39;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
    }
    h1 { margin: 0; font-size: 1.25rem; color: #fff; }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
      justify-content: space-between;
    }
    @media (min-width: 600px) {
      .controls { width: auto; }
      h1 { font-size: 1.5rem; }
    }
    select, button {
      background: var(--card-bg);
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent-green); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .table-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
    }
    table { width: 100%; min-width: 550px; border-collapse: collapse; }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }
    th { background: #161a25; color: #848e9c; font-weight: 600; white-space: nowrap; }
    tr:hover { background: #262b3e; }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      display: inline-block;
      white-space: nowrap;
    }
    .badge-bull { background: rgba(14, 203, 129, 0.15); color: var(--accent-green); }
    .badge-bear { background: rgba(246, 70, 93, 0.15); color: var(--accent-red); }
    .status { font-size: 0.85rem; color: #848e9c; margin-bottom: 10px; min-height: 1.2em; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>⚡ SMC 永續合約掃描器</h1>
    <div class="controls">
      <label style="font-size: 0.9rem;">周期：
        <select id="timeframe">
          <option value="15m" selected>15 分鐘</option>
          <option value="1h">1 小時</option>
          <option value="4h">4 小時</option>
        </select>
      </label>
      <button id="scanBtn" onclick="startScan()">🚀 開始 WebSocket 掃描</button>
    </div>
  </header>

  <div class="status" id="statusText">點擊按鈕開啟直連幣安數據通道...</div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>幣種名稱</th>
          <th>當前價格</th>
          <th>偵測訊號型態</th>
          <th>方向</th>
          <th>參考觀察區間</th>
        </tr>
      </thead>
      <tbody id="resultBody">
        <tr><td colspan="5" style="text-align: center; color: #848e9c;">暫無數據</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // 監控的熱門永續合約幣種清單
  const TARGET_SYMBOLS = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'BNBUSDT', 'XRPUSDT', 'DOGEUSDT', 'ADAUSDT', 'AVAXUSDT', 'LINKUSDT', 'NEARUSDT'];
  
  let ws = null;
  const klineData = {}; // 暫存每個幣種的 K 線歷史

  // SMC 策略邏輯判斷
  function analyzePattern(klines) {
    const len = klines.length;
    if (len < 5) return null;

    const k1 = klines[len - 3];
    const k2 = klines[len - 2];
    const k3 = klines[len - 1];

    // 1. FVG 缺口 (第6招)
    if (k1.high < k3.low) return { pattern: 'FVG 缺口', type: '看多 (Bullish)', range: `${k1.high} - ${k3.low}` };
    if (k1.low > k3.high) return { pattern: 'FVG 缺口', type: '看空 (Bearish)', range: `${k3.high} - ${k1.low}` };

    // 2. 假突破/流動性掠奪 (第1、2招)
    const prevHigh = Math.max(...klines.slice(len - 10, len - 2).map(k => k.high));
    const prevLow = Math.min(...klines.slice(len - 10, len - 2).map(k => k.low));

    if (k2.high > prevHigh && k2.close < prevHigh) return { pattern: '假突破掠奪', type: '看空 (Bearish)', range: `掃高點: ${k2.high}` };
    if (k2.low < prevLow && k2.close > prevLow) return { pattern: '假突破掠奪', type: '看多 (Bullish)', range: `掃低點: ${k2.low}` };

    return null;
  }

  // 更新 UI 畫面
  function renderTable() {
    const tbody = document.getElementById('resultBody');
    let html = '';
    let foundCount = 0;

    Object.keys(klineData).forEach(symbol => {
      const klines = klineData[symbol];
      const signal = analyzePattern(klines);

      if (signal) {
        foundCount++;
        const currentPrice = klines[klines.length - 1].close;
        const isBull = signal.type.includes('看多');
        html += `
          <tr>
            <td><strong>${symbol}</strong></td>
            <td>${currentPrice}</td>
            <td>${signal.pattern}</td>
            <td><span class="badge ${isBull ? 'badge-bull' : 'badge-bear'}">${signal.type}</span></td>
            <td>${signal.range}</td>
          </tr>
        `;
      }
    });

    tbody.innerHTML = foundCount > 0 ? html : '<tr><td colspan="5" style="text-align: center; color: #848e9c;">WebSocket 監控中，暫未發現符合 SMC 型態的訊號</td></tr>';
  }

  function startScan() {
    const timeframe = document.getElementById('timeframe').value;
    const statusText = document.getElementById('statusText');
    const scanBtn = document.getElementById('scanBtn');

    // 關閉舊連線
    if (ws) ws.close();

    scanBtn.disabled = true;
    statusText.innerText = '正在建立幣安 WebSocket 直連通道...';

    // 構建幣安合約 WebSocket 多流訂閱網址 (無需代理)
    const streams = TARGET_SYMBOLS.map(s => `${s.toLowerCase()}@kline_${timeframe}`).join('/');
    const wsUrl = `wss://fstream.binance.com/stream?streams=${streams}`;

    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      statusText.innerText = `⚡ 幣安 WebSocket 連線成功！正在即時串流監控 ${TARGET_SYMBOLS.length} 個主要永續合約幣種...`;
      scanBtn.disabled = false;
    };

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (!msg.data) return;

      const k = msg.data.k;
      const symbol = k.s;

      if (!klineData[symbol]) klineData[symbol] = [];

      // 構建與更新 K 線長度
      const candle = { open: parseFloat(k.o), high: parseFloat(k.h), low: parseFloat(k.l), close: parseFloat(k.c) };
      
      if (klineData[symbol].length === 0) {
        klineData[symbol] = Array(10).fill(candle); // 初始化緩衝區
      } else {
        klineData[symbol][klineData[symbol].length - 1] = candle;
        if (k.x) { // 若該根 K 線收盤，推進下一根
          klineData[symbol].push(candle);
          if (klineData[symbol].length > 20) klineData[symbol].shift();
        }
      }

      renderTable();
    };

    ws.onerror = (err) => {
      console.error(err);
      statusText.innerText = '❌ WebSocket 連線失敗，請檢查網路。';
      scanBtn.disabled = false;
    };

    ws.onclose = () => {
      statusText.innerText = 'WebSocket 已斷開連線。';
      scanBtn.disabled = false;
    };
  }
</script>

</body>
</html>
