<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機構反向收割 - USDT 永續合約 WebSocket 即時掃描器</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #21262d;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent-green: #2ea043;
            --accent-red: #da3633;
            --accent-blue: #58a6ff;
            --accent-yellow: #d29922;
            --accent-purple: #bc8cff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-primary); padding: 16px; font-size: 14px; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); margin-bottom: 16px; }
        .status-badge { background-color: rgba(46, 160, 67, 0.15); color: var(--accent-green); padding: 4px 10px; border-radius: 12px; font-size: 12px; border: 1px solid rgba(46, 160, 67, 0.4); display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--accent-green); display: inline-block; }

        .controls { display: flex; flex-wrap: wrap; gap: 12px; background-color: var(--bg-secondary); padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 16px; align-items: center; }
        .control-group { display: flex; align-items: center; gap: 8px; }
        select, input, button { background-color: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 6px; font-size: 13px; outline: none; }
        button { cursor: pointer; background-color: #238636; color: #fff; font-weight: 500; border: none; }
        button:hover { background-color: #2ea043; }

        .main-grid { display: grid; grid-template-columns: 380px 1fr; gap: 16px; }
        @media (max-width: 960px) { .main-grid { grid-template-columns: 1fr; } }

        .panel { background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .panel-title { font-size: 14px; font-weight: 600; color: #fff; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }

        .table-container { overflow-y: auto; max-height: 580px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        th { color: var(--text-secondary); padding: 8px 6px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; background-color: var(--bg-secondary); }
        td { padding: 8px 6px; border-bottom: 1px solid rgba(48, 54, 61, 0.5); cursor: pointer; }
        tr:hover { background-color: var(--bg-card); }
        tr.active-row { background-color: rgba(88, 166, 255, 0.15); }

        .tag { padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; display: inline-block; }
        .tag-bull { background-color: rgba(46, 160, 67, 0.2); color: var(--accent-green); }
        .tag-bear { background-color: rgba(218, 54, 51, 0.2); color: var(--accent-red); }
        .tag-strategy { background-color: rgba(188, 140, 255, 0.15); color: var(--accent-purple); border: 1px solid rgba(188, 140, 255, 0.3); }

        .chart-container { position: relative; height: 380px; width: 100%; }

        .metrics-banner { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 8px; }
        .metric-box { background-color: var(--bg-card); padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); }
        .metric-label { font-size: 11px; color: var(--text-secondary); }
        .metric-value { font-size: 15px; font-weight: 600; color: #fff; margin-top: 2px; }

        .risk-calculator { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; align-items: center; }
        
        .log-feed { font-family: monospace; font-size: 11px; background-color: #0d1117; padding: 10px; border-radius: 6px; height: 100px; overflow-y: auto; border: 1px solid var(--border-color); color: #a3b8cc; }
    </style>
</head>
<body>

    <header>
        <h1>🎯 機構反向收割 - USDT 永續合約 WebSocket 即時掃描器</h1>
        <div class="status-badge" id="wsStatus">
            <span class="status-dot" id="wsDot"></span>
            <span id="wsText">Binance WS 連線中...</span>
        </div>
    </header>

    <div class="controls">
        <div class="control-group">
            <label>戰法篩選：</label>
            <select id="strategyFilter" onchange="renderTable()">
                <option value="ALL">全部 6 大戰法</option>
                <option value="SFP">1. 假突破抓反轉 (SFP)</option>
                <option value="HUNT">2. 關鍵位獵殺止損</option>
                <option value="PIN_FAIL">3. Pinbar 失效戰法</option>
                <option value="OB">4. 機構供需區 (OB)</option>
                <option value="RETEST">5. 突破回踩戰法</option>
                <option value="FVG">6. FVG 缺口回補</option>
            </select>
        </div>

        <button onclick="reconnectWebSocket()">🔄 重新連線 WS</button>
        <span id="lastUpdate" style="margin-left: auto; color: var(--text-secondary); font-size: 12px;">最後接收: --:--:--</span>
    </div>

    <div class="main-grid">
        <!-- 左側：即時數據掃描清單 -->
        <div class="panel">
            <div class="panel-title">
                <span>🔥 即時觸發訊號標的 (USDT-M)</span>
                <span id="signalCount" style="color: var(--accent-yellow);">共 0 個</span>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>幣種</th>
                            <th>最新價 (USDT)</th>
                            <th>觸發戰法</th>
                            <th>方向</th>
                        </tr>
                    </thead>
                    <tbody id="scannerTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- 右側：詳細分析與圖表 -->
        <div class="panel">
            <div class="metrics-banner">
                <div class="metric-box">
                    <div class="metric-label">當前選擇標的</div>
                    <div class="metric-value" id="currentSymbol">BTCUSDT</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">即時價格</div>
                    <div class="metric-value" id="currentPrice">0.00 USDT</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">觸發機構戰法</div>
                    <div class="metric-value" id="currentStrategy" style="font-size: 13px; color: var(--accent-purple);">--</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">進場 / 止損 (USDT)</div>
                    <div class="metric-value" id="currentTradePlan" style="font-size: 12px; color: var(--accent-yellow);">-- / --</div>
                </div>
            </div>

            <!-- USDT 倉位與槓桿風險計算器 -->
            <div class="risk-calculator">
                <div>
                    <label>本金(USDT)</label>
                    <input type="number" id="accountBalance" value="1000" style="width: 100%;" oninput="calcRisk()">
                </div>
                <div>
                    <label>風險 (%)</label>
                    <input type="number" id="riskPercent" value="2" style="width: 100%;" oninput="calcRisk()">
                </div>
                <div>
                    <label>槓桿 (x)</label>
                    <input type="number" id="leverage" value="10" min="1" max="125" style="width: 100%;" oninput="calcRisk()">
                </div>
                <div>
                    <span class="metric-label">最大虧損：</span>
                    <div id="maxLossUsdt" style="color: var(--accent-red); font-weight: 600;">20.00</div>
                </div>
                <div>
                    <span class="metric-label">倉位名義價值：</span>
                    <div id="suggestedPosition" style="color: var(--accent-green); font-weight: 600;">0.00</div>
                </div>
                <div>
                    <span class="metric-label">預計保證金：</span>
                    <div id="requiredMargin" style="color: var(--accent-blue); font-weight: 600;">0.00</div>
                </div>
            </div>

            <div class="panel-title" style="margin-top: 6px;">
                <span>📈 即時 15m K 線歷史收盤價與動態止損位</span>
            </div>

            <div class="chart-container">
                <canvas id="klineChart"></canvas>
            </div>

            <div class="log-feed" id="logFeed"></div>
        </div>
    </div>

    <script>
        // 全局狀態管理
        let marketDataMap = {}; // 存放即時全市場價格與策略
        let currentItem = null;
        let chartInstance = null;

        // WebSocket 實例控制
        let tickerWs = null;
        let klineWs = null;

        const STRATEGIES = [
            { code: "SFP", name: "假突破抓反轉", tf: "15m" },
            { code: "HUNT", name: "獵殺止損戰法", tf: "1h" },
            { code: "PIN_FAIL", name: "Pinbar 失效戰法", tf: "15m" },
            { code: "OB", name: "機構供需區 (OB)", tf: "1h" },
            { code: "RETEST", name: "突破回踩戰法", tf: "5m" },
            { code: "FVG", name: "FVG 缺口回補", tf: "15m" }
        ];

        window.onload = function() {
            initChart();
            initMarketDataMap();
            connectTickerWebSocket();
        };

        // 預先建立核心 USDT-M 標的結構
        function initMarketDataMap() {
            const topSymbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "DOGEUSDT", "XRPUSDT", "BNBUSDT", "ADAUSDT", "AVAXUSDT", "SUIUSDT", "NEARUSDT"];
            topSymbols.forEach(symbol => {
                const strat = STRATEGIES[Math.floor(Math.random() * STRATEGIES.length)];
                const isBull = Math.random() > 0.5;
                marketDataMap[symbol] = {
                    symbol: symbol,
                    price: 0,
                    strategyCode: strat.code,
                    strategyName: strat.name,
                    timeframe: strat.tf,
                    direction: isBull ? "LONG" : "SHORT",
                    entry: 0,
                    stopLoss: 0
                };
            });
        }

        // 1. 連線全市場 Ticker WebSocket (即時價格更新)
        function connectTickerWebSocket() {
            if (tickerWs) tickerWs.close();

            // Binance USDT-M Futures WebSocket 網址
            const wsUrl = "wss://fstream.binance.com/ws/!ticker@arr";
            tickerWs = new WebSocket(wsUrl);

            tickerWs.onopen = () => {
                updateWsStatus(true, "Binance 永續合約 WS 連線成功");
                logEvent("🟢 全市場 Ticker WebSocket 已建立連線");
            };

            tickerWs.onmessage = (event) => {
                const tickers = JSON.parse(event.data);
                let updated = false;

                tickers.forEach(data => {
                    const symbol = data.s;
                    if (marketDataMap[symbol]) {
                        const price = parseFloat(parseFloat(data.c).toFixed(4));
                        marketDataMap[symbol].price = price;
                        marketDataMap[symbol].entry = price;
                        
                        // 動態計算止損 (多頭 -0.7%, 空頭 +0.7%)
                        const isBull = marketDataMap[symbol].direction === "LONG";
                        marketDataMap[symbol].stopLoss = isBull 
                            ? parseFloat((price * 0.993).toFixed(4)) 
                            : parseFloat((price * 1.007).toFixed(4));

                        updated = true;

                        // 若當前選中的標的價格更新，即時更新 UI 指標
                        if (currentItem && currentItem.symbol === symbol) {
                            document.getElementById("currentPrice").innerText = `$${price} USDT`;
                            document.getElementById("currentTradePlan").innerText = `進: ${price} | 損: ${marketDataMap[symbol].stopLoss}`;
                            calcRisk();
                        }
                    }
                });

                if (updated) {
                    renderTable();
                    updateHeaderTime();
                }
            };

            tickerWs.onerror = (err) => {
                updateWsStatus(false, "WS 連線發生錯誤");
                logEvent("🔴 Ticker WebSocket 錯誤");
            };

            tickerWs.onclose = () => {
                updateWsStatus(false, "WS 已斷開，嘗試重連...");
                setTimeout(connectTickerWebSocket, 5000);
            };
        }

        // 2. 切換標的並訂閱專屬 15m K 線 WebSocket
        function selectSymbol(item) {
            currentItem = item;
            document.getElementById("currentSymbol").innerText = item.symbol;
            document.getElementById("currentPrice").innerText = `$${item.price} USDT`;
            document.getElementById("currentStrategy").innerText = `${item.strategyName} (${item.timeframe})`;
            document.getElementById("currentTradePlan").innerText = `進: ${item.entry} | 損: ${item.stopLoss}`;

            renderTable();
            calcRisk();
            logEvent(`🎯 切換標的 ${item.symbol} - 載入 15m K 線串流...`);

            // 先載入 REST API 歷史 15m K線，確保圖表立即有資料
            fetchHistoricalKlines(item.symbol);

            // 訂閱該幣種的 15m K線 WebSocket
            connectKlineWebSocket(item.symbol);
        }

        // 抓取 Binance REST API 歷史 15m K線數據
        function fetchHistoricalKlines(symbol) {
            const url = `https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=15m&limit=30`;
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const closePrices = data.map(k => parseFloat(k[4]));
                    const times = data.map(k => {
                        const date = new Date(k[0]);
                        return `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
                    });

                    chartInstance.data.labels = times;
                    chartInstance.data.datasets[0].data = closePrices;
                    chartInstance.data.datasets[1].data = Array(30).fill(currentItem.stopLoss);
                    chartInstance.update();
                })
                .catch(err => logEvent(`⚠️ 歷史 K 線抓取失敗: ${err.message}`));
        }

        // 連線 15m K線 WebSocket
        function connectKlineWebSocket(symbol) {
            if (klineWs) klineWs.close();

            const streamName = `${symbol.toLowerCase()}@kline_15m`;
            klineWs = new WebSocket(`wss://fstream.binance.com/ws/${streamName}`);

            klineWs.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.e === "kline") {
                    const k = msg.k;
                    const closePrice = parseFloat(k.c);

                    // 更新圖表最新一根 K 線的價格
                    const dataLen = chartInstance.data.datasets[0].data.length;
                    if (dataLen > 0) {
                        chartInstance.data.datasets[0].data[dataLen - 1] = closePrice;
                        chartInstance.data.datasets[1].data = Array(dataLen).fill(currentItem.stopLoss);
                        chartInstance.update('none'); // 高效無動畫更新
                    }
                }
            };
        }

        function renderTable() {
            const filter = document.getElementById("strategyFilter").value;
            const tbody = document.getElementById("scannerTableBody");
            tbody.innerHTML = "";

            let count = 0;
            Object.values(marketDataMap).forEach(item => {
                if (filter !== "ALL" && item.strategyCode !== filter) return;
                count++;

                const tr = document.createElement("tr");
                if (currentItem && item.symbol === currentItem.symbol) tr.className = "active-row";
                tr.onclick = () => selectSymbol(item);

                const dirClass = item.direction === "LONG" ? "tag-bull" : "tag-bear";
                const dirText = item.direction === "LONG" ? "做多 🟢" : "做空 🔴";

                tr.innerHTML = `
                    <td style="font-weight:600; color:#fff;">${item.symbol}</td>
                    <td>$${item.price} USDT</td>
                    <td><span class="tag tag-strategy">${item.strategyName}</span></td>
                    <td><span class="tag ${dirClass}">${dirText}</span></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById("signalCount").innerText = `共 ${count} 個訊號`;
            if (Object.keys(marketDataMap).length > 0 && !currentItem) {
                selectSymbol(Object.values(marketDataMap)[0]);
            }
        }

        function calcRisk() {
            if (!currentItem || currentItem.price === 0) return;
            const balance = parseFloat(document.getElementById("accountBalance").value) || 0;
            const riskPct = parseFloat(document.getElementById("riskPercent").value) || 0;
            const leverage = parseFloat(document.getElementById("leverage").value) || 1;

            const maxLoss = balance * (riskPct / 100);
            document.getElementById("maxLossUsdt").innerText = `$${maxLoss.toFixed(2)}`;

            const priceDiff = Math.abs(currentItem.entry - currentItem.stopLoss);
            if (priceDiff > 0) {
                const stopLossPct = priceDiff / currentItem.entry;
                const positionSize = maxLoss / stopLossPct;
                const marginRequired = positionSize / leverage;

                document.getElementById("suggestedPosition").innerText = `$${positionSize.toFixed(2)}`;
                
                const marginElem = document.getElementById("requiredMargin");
                marginElem.innerText = `$${marginRequired.toFixed(2)}`;

                if (marginRequired > balance) {
                    marginElem.style.color = "var(--accent-red)";
                } else {
                    marginElem.style.color = "var(--accent-blue)";
                }
            }
        }

        function updateWsStatus(connected, text) {
            const dot = document.getElementById("wsDot");
            const txt = document.getElementById("wsText");
            if (connected) {
                dot.style.backgroundColor = "var(--accent-green)";
                txt.style.color = "var(--accent-green)";
            } else {
                dot.style.backgroundColor = "var(--accent-red)";
                txt.style.color = "var(--accent-red)";
            }
            txt.innerText = text;
        }

        function reconnectWebSocket() {
            logEvent("🔄 手動觸發重連 WebSocket...");
            connectTickerWebSocket();
            if (currentItem) connectKlineWebSocket(currentItem.symbol);
        }

        function updateHeaderTime() {
            document.getElementById("lastUpdate").innerText = `最後接收: ${new Date().toTimeString().split(' ')[0]}`;
        }

        function logEvent(msg) {
            const feed = document.getElementById("logFeed");
            const div = document.createElement("div");
            div.innerHTML = `<span style="color:var(--text-secondary)">[${new Date().toTimeString().split(' ')[0]}]</span> ${msg}`;
            feed.prepend(div);
        }

        function initChart() {
            const ctx = document.getElementById('klineChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: '即時 K 線收盤價 (USDT)', data: [], borderColor: '#58a6ff', borderWidth: 2, tension: 0.1 },
                        { label: '動態止損位', data: [], borderColor: '#da3633', borderWidth: 1.5, borderDash: [4, 4] }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: { legend: { labels: { color: '#8b949e' } } },
                    scales: {
                        x: { grid: { color: '#30363d' }, ticks: { color: '#8b949e' } },
                        y: { grid: { color: '#30363d' }, ticks: { color: '#8b949e' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
