<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMC 永續合約極速掃描器</title>
  <style>
    :root {
      --bg-color: #121418;
      --card-bg: #1e222d;
      --text-color: #d1d4dc;
      --accent-green: #0ecb81;
      --accent-red: #f6465d;
      --border-color: #2a2e39;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
    }
    h1 { margin: 0; font-size: 1.25rem; color: #fff; }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
      justify-content: space-between;
    }
    @media (min-width: 600px) {
      .controls { width: auto; }
      h1 { font-size: 1.5rem; }
    }
    select, button {
      background: var(--card-bg);
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent-green); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* 防手機端擠壓跑版的橫向滾動容器 */
    .table-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
    }
    table {
      width: 100%;
      min-width: 550px; /* 保障表格欄位正常排列 */
      border-collapse: collapse;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }
    th { background: #161a25; color: #848e9c; font-weight: 600; white-space: nowrap; }
    tr:hover { background: #262b3e; }
    
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      display: inline-block;
      white-space: nowrap;
    }
    .badge-bull { background: rgba(14, 203, 129, 0.15); color: var(--accent-green); }
    .badge-bear { background: rgba(246, 70, 93, 0.15); color: var(--accent-red); }
    .status { font-size: 0.85rem; color: #848e9c; margin-bottom: 10px; min-height: 1.2em; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>⚡ SMC 永續合約掃描器</h1>
    <div class="controls">
      <label style="font-size: 0.9rem;">周期：
        <select id="timeframe">
          <option value="15m" selected>15 分鐘</option>
          <option value="1h">1 小時</option>
          <option value="4h">4 小時</option>
        </select>
      </label>
      <button id="scanBtn" onclick="startScan()">🚀 開始掃描</button>
    </div>
  </header>

  <div class="status" id="statusText">點擊「開始掃描」獲取即時訊號...</div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>幣種名稱</th>
          <th>當前價格</th>
          <th>偵測訊號型態</th>
          <th>方向</th>
          <th>參考觀察區間</th>
        </tr>
      </thead>
      <tbody id="resultBody">
        <tr><td colspan="5" style="text-align: center; color: #848e9c;">暫無數據</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // 使用安全代理繞過 GitHub Pages CORS 與地區限制
  const CORS_PROXY = "https://corsproxy.io/?";

  async function fetchAPI(url) {
    const targetUrl = CORS_PROXY + encodeURIComponent(url);
    const res = await fetch(targetUrl);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  }

  // 取得成交量前 20 名 USDT 合約幣種
  async function getTopSymbols() {
    const data = await fetchAPI('https://fapi.binance.com/fapi/1/ticker/24hr');
    return data
      .filter(item => item.symbol.endsWith('USDT'))
      .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
      .slice(0, 20)
      .map(item => item.symbol);
  }

  // 取得單一幣種 K線數據
  async function getKlines(symbol, interval) {
    const data = await fetchAPI(`https://fapi.binance.com/fapi/1/klines?symbol=${symbol}&interval=${interval}&limit=20`);
    return data.map(k => ({
      high: parseFloat(k[2]),
      low: parseFloat(k[3]),
      close: parseFloat(k[4]),
      open: parseFloat(k[1])
    }));
  }

  // SMC 策略邏輯判斷
  function analyzePattern(klines) {
    const len = klines.length;
    if (len < 5) return null;

    const k1 = klines[len - 3];
    const k2 = klines[len - 2];
    const k3 = klines[len - 1];

    // 1. FVG 價格缺口 (第6招)
    if (k1.high < k3.low) {
      return { pattern: 'FVG 缺口', type: '看多 (Bullish)', range: `${k1.high} - ${k3.low}` };
    }
    if (k1.low > k3.high) {
      return { pattern: 'FVG 缺口', type: '看空 (Bearish)', range: `${k3.high} - ${k1.low}` };
    }

    // 2. 假突破/流動性掠奪 (第1、2招)
    const prevHigh = Math.max(...klines.slice(len - 10, len - 2).map(k => k.high));
    const prevLow = Math.min(...klines.slice(len - 10, len - 2).map(k => k.low));

    if (k2.high > prevHigh && k2.close < prevHigh) {
      return { pattern: '假突破掠奪', type: '看空 (Bearish)', range: `掃高點: ${k2.high}` };
    }
    if (k2.low < prevLow && k2.close > prevLow) {
      return { pattern: '假突破掠奪', type: '看多 (Bullish)', range: `掃低點: ${k2.low}` };
    }

    return null;
  }

  async function startScan() {
    const timeframe = document.getElementById('timeframe').value;
    const statusText = document.getElementById('statusText');
    const tbody = document.getElementById('resultBody');
    const scanBtn = document.getElementById('scanBtn');

    scanBtn.disabled = true;
    statusText.innerText = '正在連線幣安 API 並分析中...';
    tbody.innerHTML = '';

    try {
      const symbols = await getTopSymbols();
      let foundCount = 0;

      // 使用並行請求提高速度
      const tasks = symbols.map(async (symbol) => {
        try {
          const klines = await getKlines(symbol, timeframe);
          const signal = analyzePattern(klines);

          if (signal) {
            foundCount++;
            const currentPrice = klines[klines.length - 1].close;
            const isBull = signal.type.includes('看多');
            return `
              <tr>
                <td><strong>${symbol}</strong></td>
                <td>${currentPrice}</td>
                <td>${signal.pattern}</td>
                <td><span class="badge ${isBull ? 'badge-bull' : 'badge-bear'}">${signal.type}</span></td>
                <td>${signal.range}</td>
              </tr>
            `;
          }
        } catch (e) {
          console.warn(`${symbol} 請求失敗`, e);
        }
        return '';
      });

      const results = await Promise.all(tasks);
      const htmlContent = results.join('');

      tbody.innerHTML = foundCount > 0 ? htmlContent : '<tr><td colspan="5" style="text-align: center; color: #848e9c;">未發現符合 SMC 型態的熱門幣種</td></tr>';
      statusText.innerText = `掃描完畢！共分析 20 個熱門幣種，發現 ${foundCount} 個訊號。`;

    } catch (err) {
      console.error(err);
      statusText.innerText = '❌ 請求失敗，請稍後再試。';
    } finally {
      scanBtn.disabled = false;
    }
  }
</script>

</body>
</html>
