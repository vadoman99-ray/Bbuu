<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMC 15m/1m 雙框架假突破極速掃描器</title>
  <style>
    :root {
      --bg-color: #121418;
      --card-bg: #1e222d;
      --text-color: #d1d4dc;
      --accent-green: #0ecb81;
      --accent-red: #f6465d;
      --border-color: #2a2e39;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
    }
    h1 { margin: 0; font-size: 1.25rem; color: #fff; }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button {
      background: var(--card-bg);
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { border-color: var(--accent-green); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .table-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
    }
    table { width: 100%; min-width: 650px; border-collapse: collapse; }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
    }
    th { background: #161a25; color: #848e9c; font-weight: 600; white-space: nowrap; }
    tr:hover { background: #262b3e; }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      display: inline-block;
      white-space: nowrap;
    }
    .badge-bull { background: rgba(14, 203, 129, 0.15); color: var(--accent-green); }
    .badge-bear { background: rgba(246, 70, 93, 0.15); color: var(--accent-red); }
    .status { font-size: 0.85rem; color: #848e9c; margin-bottom: 10px; min-height: 1.2em; }
    .price-tag { font-family: monospace; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>⚡ 15m/1m 雙框架假突破【極速版】掃描器</h1>
    <div class="controls">
      <button id="scanBtn" onclick="startScan()">⚡ 併發極速掃描</button>
    </div>
  </header>

  <div class="status" id="statusText">點擊按鈕，啟動多線程平行掃描...</div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>幣種</th>
          <th>方向</th>
          <th>15m 觸發狀態</th>
          <th>1m 進場狀態</th>
          <th>參考進場價</th>
          <th>建議止損位</th>
        </tr>
      </thead>
      <tbody id="resultBody">
        <tr><td colspan="6" style="text-align: center; color: #848e9c;">點擊上方按鈕開始極速分析</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // 代理列表
  const PROXIES = [
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
  ];

  async function fetchWithTimeout(url, timeout = 3000) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeout);
    
    for (let proxy of PROXIES) {
      try {
        const res = await fetch(proxy(url), { signal: controller.signal });
        clearTimeout(id);
        if (res.ok) return await res.json();
      } catch (e) {
        // 切換下一個代理
      }
    }
    clearTimeout(id);
    throw new Error('Timeout or Failed');
  }

  // 獲取前 15 名熱門幣種
  async function getTopSymbols() {
    const data = await fetchWithTimeout('https://fapi.binance.com/fapi/1/ticker/24hr');
    return data
      .filter(item => item.symbol.endsWith('USDT'))
      .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
      .slice(0, 15)
      .map(item => item.symbol);
  }

  // 檢測 Sweep（假突破掠奪）
  function checkSweep(klines) {
    const len = klines.length;
    if (len < 5) return null;

    const current = klines[len - 1]; 
    const prevHigh = Math.max(...klines.slice(len - 12, len - 1).map(k => k.high));
    const prevLow = Math.min(...klines.slice(len - 12, len - 1).map(k => k.low));

    // 向上刺穿但收回（做空）
    if (current.high > prevHigh && current.close < prevHigh) {
      return { type: 'Bearish', sweepPoint: current.high, entryPrice: current.close };
    }
    // 向下刺穿但收回（做多）
    if (current.low < prevLow && current.close > prevLow) {
      return { type: 'Bullish', sweepPoint: current.low, entryPrice: current.close };
    }

    return null;
  }

  // 單個幣種平行分析
  async function analyzeSymbol(symbol) {
    try {
      // 併發同時請求 15m 與 1m K線，節省網路來回時間
      const [res15m, res1m] = await Promise.all([
        fetchWithTimeout(`https://fapi.binance.com/fapi/1/klines?symbol=${symbol}&interval=15m&limit=15`),
        fetchWithTimeout(`https://fapi.binance.com/fapi/1/klines?symbol=${symbol}&interval=1m&limit=15`)
      ]);

      const parseKlines = data => data.map(k => ({
        high: parseFloat(k[2]),
        low: parseFloat(k[3]),
        close: parseFloat(k[4])
      }));

      const klines15m = parseKlines(res15m);
      const signal15m = checkSweep(klines15m);

      if (signal15m) {
        const klines1m = parseKlines(res1m);
        const signal1m = checkSweep(klines1m);

        return {
          symbol,
          signal15m,
          signal1m
        };
      }
    } catch (e) {
      return null;
    }
    return null;
  }

  async function startScan() {
    const statusText = document.getElementById('statusText');
    const tbody = document.getElementById('resultBody');
    const scanBtn = document.getElementById('scanBtn');

    const startTime = Date.now();
    scanBtn.disabled = true;
    statusText.innerText = '⚡ 正在進行併發高速掃描...';
    tbody.innerHTML = '';

    try {
      const symbols = await getTopSymbols();
      
      // 使用 Promise.all 同時發起所有幣種的掃描
      const results = await Promise.all(symbols.map(sym => analyzeSymbol(sym)));
      const validResults = results.filter(r => r !== null);

      if (validResults.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #848e9c;">當前熱門標的未發現符合 15m/1m 雙框架假突破訊號</td></tr>';
      } else {
        validResults.forEach(res => {
          const isBull = res.signal15m.type === 'Bullish';
          const status1mText = res.signal1m ? '🔥 1m 同步出現掃蕩點（即刻進場）' : '⏳ 1m 等待二次掃蕩訊號';

          const row = `
            <tr>
              <td><strong>${res.symbol}</strong></td>
              <td><span class="badge ${isBull ? 'badge-bull' : 'badge-bear'}">${isBull ? '看多 (Long)' : '看空 (Short)'}</span></td>
              <td>15m 區間 Sweep 已形成</td>
              <td>${status1mText}</td>
              <td class="price-tag">${res.signal1m ? res.signal1m.entryPrice : res.signal15m.entryPrice}</td>
              <td class="price-tag" style="color: var(--accent-red);">${res.signal15m.sweepPoint}</td>
            </tr>
          `;
          tbody.innerHTML += row;
        });
      }

      const duration = ((Date.now() - startTime) / 1000).toFixed(2);
      statusText.innerText = `⚡ 掃描完成！僅耗時 ${duration} 秒，發現 ${validResults.length} 個潛在標的。`;

    } catch (err) {
      console.error(err);
      statusText.innerText = '❌ 掃描失敗，請檢查網路。';
    } finally {
      scanBtn.disabled = false;
    }
  }
</script>

</body>
</html>
