<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>機構反向收割 - SMC 掃描器 (成交額 1 億+ / 做多做空分頁版)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #21262d;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent-green: #2ea043;
            --accent-red: #da3633;
            --accent-blue: #58a6ff;
            --accent-yellow: #d29922;
            --accent-purple: #bc8cff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background-color: var(--bg-primary); 
            color: var(--text-primary); 
            padding: 16px; 
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            font-size: 14px; 
            min-height: 100vh;
        }
        
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); margin-bottom: 16px; }
        .status-badge { background-color: rgba(88, 166, 255, 0.15); color: var(--accent-blue); padding: 4px 10px; border-radius: 12px; font-size: 12px; border: 1px solid rgba(88, 166, 255, 0.4); display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--accent-blue); display: inline-block; }

        .tg-panel { display: flex; flex-wrap: wrap; gap: 10px; background-color: rgba(88, 166, 255, 0.08); padding: 10px 16px; border-radius: 8px; border: 1px solid rgba(88, 166, 255, 0.3); margin-bottom: 16px; align-items: center; }
        .tg-panel label { font-size: 12px; color: var(--accent-blue); font-weight: 600; }

        .controls { display: flex; flex-wrap: wrap; gap: 12px; background-color: var(--bg-secondary); padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 16px; align-items: center; }
        .control-group { display: flex; align-items: center; gap: 8px; }
        select, input, button { background-color: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 6px; font-size: 13px; outline: none; }
        button { cursor: pointer; background-color: #238636; color: #fff; font-weight: 500; border: none; }
        button:hover { background-color: #2ea043; }
        button:disabled { background-color: #30363d; color: var(--text-secondary); cursor: not-allowed; }
        .btn-tg { background-color: #1f6feb; }
        .btn-tg:hover { background-color: #388bfd; }

        .progress-bar-container { width: 100%; background-color: var(--bg-card); border-radius: 4px; height: 6px; overflow: hidden; margin-top: 4px; display: none; }
        .progress-bar { height: 100%; background-color: var(--accent-blue); width: 0%; transition: width 0.1s ease; }

        /* 🏷️ 分頁標籤樣式 */
        .tab-container { display: flex; gap: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 12px; }
        .tab-btn { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .tab-btn.active-long { background-color: rgba(46, 160, 67, 0.2); color: var(--accent-green); border-color: var(--accent-green); }
        .tab-btn.active-short { background-color: rgba(218, 54, 51, 0.2); color: var(--accent-red); border-color: var(--accent-red); }

        .main-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        .panel { background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

        .table-container { overflow-y: auto; max-height: 650px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th { color: var(--text-secondary); padding: 10px 8px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; background-color: var(--bg-secondary); }
        td { padding: 10px 8px; border-bottom: 1px solid rgba(48, 54, 61, 0.5); cursor: pointer; }
        tr:hover { background-color: var(--bg-card); }

        .tag { padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; display: inline-block; }
        .tag-bull { background-color: rgba(46, 160, 67, 0.2); color: var(--accent-green); }
        .tag-bear { background-color: rgba(218, 54, 51, 0.2); color: var(--accent-red); }
        .tag-strategy { background-color: rgba(188, 140, 255, 0.15); color: var(--accent-purple); border: 1px solid rgba(188, 140, 255, 0.3); }

        .log-feed { font-family: monospace; font-size: 11px; background-color: #0d1117; padding: 10px; border-radius: 6px; height: 120px; overflow-y: auto; border: 1px solid var(--border-color); color: #a3b8cc; margin-top: 16px; }

        /* 📱 App 彈窗優化 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: none; justify-content: center; align-items: center;
            padding: 12px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            padding-top: calc(12px + env(safe-area-inset-top));
            z-index: 9999; backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px; width: 100%; max-width: 950px;
            max-height: calc(100vh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding: 16px; display: flex; flex-direction: column; gap: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .modal-close { font-size: 22px; cursor: pointer; color: var(--text-secondary); padding: 4px 8px; }
        .modal-grid { display: grid; grid-template-columns: 320px 1fr; gap: 16px; }
        @media (max-width: 768px) { .modal-grid { grid-template-columns: 1fr; } }
        .calc-form { background-color: var(--bg-card); padding: 14px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 12px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 12px; color: var(--text-secondary); }
        .form-group input { width: 100%; font-size: 14px; font-weight: 600; }
        .calc-results { background-color: #0d1117; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .result-item { display: flex; flex-direction: column; }
        .result-label { font-size: 11px; color: var(--text-secondary); }
        .result-value { font-size: 14px; font-weight: 600; margin-top: 2px; }
        .chart-box { height: 320px; position: relative; background-color: var(--bg-card); border-radius: 8px; padding: 10px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <header>
        <h1>🎯 SMC 機構掃描器 (成交額 1 億+ 高流動性版)</h1>
        <div class="status-badge">
            <span class="status-dot"></span>
            <span>REST API 模式</span>
        </div>
    </header>

    <div class="tg-panel">
        <label>🤖 Telegram 即時推播設定：</label>
        <input type="password" id="tgBotToken" placeholder="Bot Token" style="width: 200px;" onchange="saveTgSettings()">
        <input type="text" id="tgChatId" placeholder="Chat ID" style="width: 150px;" onchange="saveTgSettings()">
        <button class="btn-tg" onclick="testTelegramNotification()">✈️ 測試發送</button>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>戰法篩選：</label>
            <select id="strategyFilter" onchange="renderTable()">
                <option value="ALL">全部 SMC 戰法</option>
                <option value="SFP">1. SFP 假突破抓反轉</option>
                <option value="FVG">2. FVG 缺口回補</option>
            </select>
        </div>

        <button id="scanBtn" onclick="scanAllMarketSMC()">⚡ 掃描 1 億+ 成交額標的</button>
        <span id="lastUpdate" style="margin-left: auto; color: var(--text-secondary); font-size: 12px;">最後更新: --:--:--</span>
        
        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <div class="main-grid">
        <div class="panel">
            <!-- 🏷️ 做多與做空標籤分頁 -->
            <div class="tab-container">
                <button class="tab-btn active-long" id="tabLongBtn" onclick="switchTab('LONG')">
                    🟢 做多標的 (按 24h 漲幅排行) <span id="longCount">(0)</span>
                </button>
                <button class="tab-btn" id="tabShortBtn" onclick="switchTab('SHORT')">
                    🔴 做空標的 (按 24h 跌幅排行) <span id="shortCount">(0)</span>
                </button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>幣種</th>
                            <th>最新價 (USDT)</th>
                            <th>24h 漲跌幅</th>
                            <th>24h 成交額</th>
                            <th>戰法</th>
                            <th>預估止損</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="scannerTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="log-feed" id="logFeed"></div>

    <!-- 📊 交易試算 Modal 彈窗 -->
    <div class="modal-overlay" id="tradeModal" onclick="handleOverlayClick(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitle" style="color: #fff;">🎯 交易計畫試算</h3>
                <span class="modal-close" onclick="closeModal()">✕</span>
            </div>

            <div class="modal-grid">
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div class="calc-form">
                        <div class="form-group">
                            <label>帳戶本金 / 單筆最大承受虧損 (USDT)</label>
                            <input type="number" id="inputLossUsdt" value="20" oninput="calculateTradePlan()">
                        </div>
                        <div class="form-group">
                            <label>開倉槓桿倍數 (x)</label>
                            <input type="number" id="inputLeverage" value="10" min="1" max="125" oninput="calculateTradePlan()">
                        </div>
                        <div class="form-group">
                            <label>目標風報比 R:R (1 : X)</label>
                            <input type="number" id="inputRR" value="2" step="0.1" min="0.5" oninput="calculateTradePlan()">
                        </div>
                    </div>

                    <div class="calc-results">
                        <div class="result-item">
                            <span class="result-label">建議進場點 (USDT)</span>
                            <span class="result-value" id="resEntry" style="color: var(--accent-blue);">0.00</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">建議止損點 (SL)</span>
                            <span class="result-value" id="resStopLoss" style="color: var(--accent-red);">0.00</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">目標止盈點 (TP1)</span>
                            <span class="result-value" id="resTakeProfit" style="color: var(--accent-green);">0.00</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">止盈點 (TP2 - 1.5x)</span>
                            <span class="result-value" id="resTakeProfit2" style="color: var(--accent-green);">0.00</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">建議開倉名義價值</span>
                            <span class="result-value" id="resPositionSize" style="color: var(--accent-yellow);">0.00 USDT</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">預計佔用保證金</span>
                            <span class="result-value" id="resMargin" style="color: #fff;">0.00 USDT</span>
                        </div>
                    </div>
                </div>

                <div class="chart-box">
                    <canvas id="modalChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let marketDataMap = {};
        let currentTab = "LONG"; // 預設頁籤
        let currentModalItem = null;
        let modalChartInstance = null;
        let isScanning = false;
        let pollingTimer = null;
        let notifiedSignals = new Set();

        const MIN_VOLUME_USDT = 100000000; // 💰 成交額門檻：1 億 USDT

        window.onload = function() {
            initModalChart();
            loadTgSettings();
            scanAllMarketSMC();
            startPollingLatestPrices();
        };

        function switchTab(tabDirection) {
            currentTab = tabDirection;
            const longBtn = document.getElementById("tabLongBtn");
            const shortBtn = document.getElementById("tabShortBtn");

            if (tabDirection === "LONG") {
                longBtn.className = "tab-btn active-long";
                shortBtn.className = "tab-btn";
            } else {
                longBtn.className = "tab-btn";
                shortBtn.className = "tab-btn active-short";
            }
            renderTable();
        }

        function loadTgSettings() {
            document.getElementById("tgBotToken").value = localStorage.getItem("SMC_TG_BOT_TOKEN") || "";
            document.getElementById("tgChatId").value = localStorage.getItem("SMC_TG_CHAT_ID") || "";
        }

        function saveTgSettings() {
            localStorage.setItem("SMC_TG_BOT_TOKEN", document.getElementById("tgBotToken").value.trim());
            localStorage.setItem("SMC_TG_CHAT_ID", document.getElementById("tgChatId").value.trim());
        }

        async function sendTelegramMessage(text) {
            const token = document.getElementById("tgBotToken").value.trim();
            const chatId = document.getElementById("tgChatId").value.trim();
            if (!token || !chatId) return false;

            try {
                const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_id: chatId, text: text, parse_mode: "HTML" })
                });
                const data = await res.json();
                return data.ok;
            } catch (err) {
                return false;
            }
        }

        async function testTelegramNotification() {
            saveTgSettings();
            const ok = await sendTelegramMessage(`<b>🚨 SMC 機構掃描器 - 連線測試</b>\n\n🟢 訊息發送成功！`);
            alert(ok ? "✅ 測試發送成功！" : "❌ 發送失敗，請檢查 Token 與 Chat ID。");
        }

        /* 🔍 獲取成交額 >= 1 億 USDT 的標的 */
        async function fetchHighVolumeSymbols() {
            try {
                const res = await fetch("https://fapi.binance.com/fapi/v1/ticker/24hr");
                const data = await res.json();
                
                return data
                    .filter(item => item.symbol.endsWith("USDT") && parseFloat(item.quoteVolume) >= MIN_VOLUME_USDT)
                    .map(item => ({
                        symbol: item.symbol,
                        priceChangePercent: parseFloat(item.priceChangePercent),
                        quoteVolume: parseFloat(item.quoteVolume)
                    }));
            } catch (err) {
                return [];
            }
        }

        async function scanAllMarketSMC() {
            if (isScanning) return;
            isScanning = true;

            const scanBtn = document.getElementById("scanBtn");
            const progressContainer = document.getElementById("progressContainer");
            const progressBar = document.getElementById("progressBar");

            scanBtn.disabled = true;
            progressContainer.style.display = "block";
            progressBar.style.width = "0%";
            marketDataMap = {}; 
            renderTable();

            logEvent("🌐 篩選 24h 成交額 ≥ 1 億 USDT 之標的...");
            const targetSymbols = await fetchHighVolumeSymbols();
            logEvent(`⚡ 符合 1 億 USDT 成交額標的共 ${targetSymbols.length} 個，開始 SMC 戰法掃描...`);

            const BATCH_SIZE = 12;
            let completed = 0;

            for (let i = 0; i < targetSymbols.length; i += BATCH_SIZE) {
                const chunk = targetSymbols.slice(i, i + BATCH_SIZE);
                await Promise.all(chunk.map(async (target) => {
                    const symbol = target.symbol;
                    try {
                        const res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=15m&limit=35`);
                        if (!res.ok) return;
                        const rawKlines = await res.json();
                        const klines = rawKlines.map(k => ({
                            high: parseFloat(k[2]),
                            low: parseFloat(k[3]),
                            close: parseFloat(k[4])
                        }));

                        const smcResult = detectSMC(klines);
                        if (smcResult) {
                            const latestPrice = klines[klines.length - 1].close;
                            marketDataMap[symbol] = {
                                symbol: symbol,
                                price: latestPrice,
                                priceChangePercent: target.priceChangePercent,
                                volumeUsdt: target.quoteVolume,
                                strategyCode: smcResult.code,
                                strategyName: smcResult.name,
                                timeframe: "15m",
                                direction: smcResult.direction,
                                entry: latestPrice,
                                stopLoss: smcResult.stopLoss
                            };
                            checkAndSendTgAlert(symbol, smcResult, latestPrice);
                        }
                    } catch (e) {
                    } finally {
                        completed++;
                    }
                }));

                progressBar.style.width = `${Math.floor((completed / targetSymbols.length) * 100)}%`;
                renderTable();
                await new Promise(r => setTimeout(r, 60));
            }

            isScanning = false;
            scanBtn.disabled = false;
            progressContainer.style.display = "none";
            logEvent(`🎉 掃描完成！發現 ${Object.keys(marketDataMap).length} 個高流動性 SMC 訊號標的。`);
            renderTable();
            updateHeaderTime();
        }

        function startPollingLatestPrices() {
            if (pollingTimer) clearInterval(pollingTimer);
            pollingTimer = setInterval(async () => {
                if (Object.keys(marketDataMap).length === 0 || isScanning) return;
                try {
                    const res = await fetch("https://fapi.binance.com/fapi/v1/ticker/24hr");
                    if (!res.ok) return;
                    const allTickers = await res.json();
                    
                    allTickers.forEach(t => {
                        if (marketDataMap[t.symbol]) {
                            marketDataMap[t.symbol].price = parseFloat(t.lastPrice);
                            marketDataMap[t.symbol].priceChangePercent = parseFloat(t.priceChangePercent);
                            marketDataMap[t.symbol].volumeUsdt = parseFloat(t.quoteVolume);
                        }
                    });

                    renderTable();
                    updateHeaderTime();
                } catch (e) {}
            }, 5000);
        }

        function checkAndSendTgAlert(symbol, smc, price) {
            const signalKey = `${symbol}_${smc.code}_${smc.direction}`;
            if (notifiedSignals.has(signalKey)) return; 
            notifiedSignals.add(signalKey); 

            const dirEmoji = smc.direction === "LONG" ? "🟢 做多 (LONG)" : "🔴 做空 (SHORT)";
            const stopLossPct = (Math.abs(price - smc.stopLoss) / price * 100).toFixed(2);

            const tgMessage = 
`🎯 <b>【SMC 戰法觸發 (成交額 1 億+)】</b>

📌 <b>標的幣種</b>：<code>${symbol}</code>
⚡ <b>觸發戰法</b>：<b>${smc.name}</b>
📈 <b>操作方向</b>：${dirEmoji}
💵 <b>當前價格</b>：<code>$${price} USDT</code>
🛡️ <b>動態止損</b>：<code>$${smc.stopLoss} USDT</code> (${stopLossPct}%)
⏰ <b>觸發時間</b>：${new Date().toTimeString().split(' ')[0]}`;

            sendTelegramMessage(tgMessage);
        }

        function detectSMC(klines) {
            const len = klines.length;
            if (len < 10) return null;

            const curr = klines[len - 1];
            const prevSlice = klines.slice(len - 25, len - 2);

            const highestHigh = Math.max(...prevSlice.map(k => k.high));
            const lowestLow = Math.min(...prevSlice.map(k => k.low));

            if (curr.high > highestHigh && curr.close < highestHigh) {
                return { code: "SFP", name: "SFP 假突破 (獵殺多頭)", direction: "SHORT", stopLoss: parseFloat((curr.high * 1.0015).toFixed(4)) };
            }

            if (curr.low < lowestLow && curr.close > lowestLow) {
                return { code: "SFP", name: "SFP 假突破 (獵殺空頭)", direction: "LONG", stopLoss: parseFloat((curr.low * 0.9985).toFixed(4)) };
            }

            const k1 = klines[len - 3];
            const k3 = klines[len - 1];

            if (k1.high < k3.low) {
                return { code: "FVG", name: "FVG 看漲缺口", direction: "LONG", stopLoss: parseFloat((k1.high * 0.998).toFixed(4)) };
            }
            if (k1.low > k3.high) {
                return { code: "FVG", name: "FVG 看跌缺口", direction: "SHORT", stopLoss: parseFloat((k1.low * 1.002).toFixed(4)) };
            }

            return null;
        }

        /* 📊 渲染表格 (包含 1億+ 成交額顯示與做多/做空漲跌幅排序) */
        function renderTable() {
            const filter = document.getElementById("strategyFilter").value;
            const tbody = document.getElementById("scannerTableBody");
            tbody.innerHTML = "";

            const allItems = Object.values(marketDataMap);

            // 分離多空標的
            const longItems = allItems.filter(i => i.direction === "LONG");
            const shortItems = allItems.filter(i => i.direction === "SHORT");

            // 更新計數
            document.getElementById("longCount").innerText = `(${longItems.length})`;
            document.getElementById("shortCount").innerText = `(${shortItems.length})`;

            // 做多：按漲幅從高到低降序排序 | 做空：按跌幅從低到高升序排序
            let displayItems = currentTab === "LONG" ? longItems : shortItems;
            displayItems.sort((a, b) => {
                return currentTab === "LONG" 
                    ? b.priceChangePercent - a.priceChangePercent 
                    : a.priceChangePercent - b.priceChangePercent;
            });

            displayItems.forEach(item => {
                if (filter !== "ALL" && item.strategyCode !== filter) return;

                const tr = document.createElement("tr");
                tr.onclick = () => openTradeModal(item);

                const changeColor = item.priceChangePercent >= 0 ? "var(--accent-green)" : "var(--accent-red)";
                const changeSign = item.priceChangePercent >= 0 ? "+" : "";
                const volIn100M = (item.volumeUsdt / 100000000).toFixed(2); // 換算成 億 USDT

                tr.innerHTML = `
                    <td style="font-weight:600; color:#fff;">${item.symbol}</td>
                    <td>$${item.price} USDT</td>
                    <td style="color:${changeColor}; font-weight:600;">${changeSign}${item.priceChangePercent.toFixed(2)}%</td>
                    <td style="color:var(--accent-yellow);">${volIn100M} 億</td>
                    <td><span class="tag tag-strategy">${item.strategyCode}</span></td>
                    <td style="color: var(--accent-red);">$${item.stopLoss}</td>
                    <td><button style="padding: 3px 8px; font-size: 11px;">📊 試算</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        /* 📱 彈窗邏輯 */
        function openTradeModal(item) {
            currentModalItem = item;
            document.getElementById("modalTitle").innerHTML = `🎯 交易試算 — ${item.symbol} <span class="tag ${item.direction === 'LONG' ? 'tag-bull' : 'tag-bear'}">${item.direction}</span>`;
            
            const modal = document.getElementById("tradeModal");
            modal.style.display = "flex";
            document.body.style.overflow = "hidden"; // 鎖定背景

            calculateTradePlan();
            loadModalChartData(item.symbol);
        }

        function closeModal() {
            document.getElementById("tradeModal").style.display = "none";
            document.body.style.overflow = "auto"; // 恢復背景滾動
        }

        function handleOverlayClick(e) {
            if (e.target.classList.contains('modal-overlay')) closeModal();
        }

        function calculateTradePlan() {
            if (!currentModalItem) return;

            const entry = currentModalItem.price;
            const sl = currentModalItem.stopLoss;
            const dir = currentModalItem.direction;

            const lossUsdt = parseFloat(document.getElementById("inputLossUsdt").value) || 0;
            const leverage = parseFloat(document.getElementById("inputLeverage").value) || 1;
            const rr = parseFloat(document.getElementById("inputRR").value) || 1;

            const priceRiskRatio = Math.abs(entry - sl) / entry;

            let tp = dir === "LONG" ? entry + (entry - sl) * rr : entry - (sl - entry) * rr;
            let tp2 = dir === "LONG" ? entry + (entry - sl) * (rr * 1.5) : entry - (sl - entry) * (rr * 1.5);

            let positionSize = priceRiskRatio > 0 ? lossUsdt / priceRiskRatio : 0;
            let margin = positionSize / leverage;

            document.getElementById("resEntry").innerText = `$${entry}`;
            document.getElementById("resStopLoss").innerText = `$${sl}`;
            document.getElementById("resTakeProfit").innerText = `$${tp.toFixed(4)}`;
            document.getElementById("resTakeProfit2").innerText = `$${tp2.toFixed(4)}`;
            document.getElementById("resPositionSize").innerText = `$${positionSize.toFixed(2)} USDT`;
            document.getElementById("resMargin").innerText = `$${margin.toFixed(2)} USDT`;

            updateModalChartLines(entry, sl, tp);
        }

        function loadModalChartData(symbol) {
            fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=15m&limit=30`)
                .then(res => res.json())
                .then(data => {
                    const closePrices = data.map(k => parseFloat(k[4]));
                    const times = data.map(k => {
                        const date = new Date(k[0]);
                        return `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
                    });

                    modalChartInstance.data.labels = times;
                    modalChartInstance.data.datasets[0].data = closePrices;
                    calculateTradePlan();
                });
        }

        function updateModalChartLines(entry, sl, tp) {
            if (!modalChartInstance || modalChartInstance.data.labels.length === 0) return;
            const count = modalChartInstance.data.labels.length;

            modalChartInstance.data.datasets[1].data = Array(count).fill(tp);
            modalChartInstance.data.datasets[2].data = Array(count).fill(entry);
            modalChartInstance.data.datasets[3].data = Array(count).fill(sl);
            modalChartInstance.update();
        }

        function initModalChart() {
            const ctx = document.getElementById('modalChart').getContext('2d');
            modalChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: '15m 收盤價', data: [], borderColor: '#58a6ff', borderWidth: 2, tension: 0.1 },
                        { label: '🎯 目標止盈 (TP)', data: [], borderColor: '#2ea043', borderWidth: 1.5, borderDash: [4, 4], pointRadius: 0 },
                        { label: '🟦 進場點位 (Entry)', data: [], borderColor: '#388bfd', borderWidth: 1.5, pointRadius: 0 },
                        { label: '🛡️ 動態止損 (SL)', data: [], borderColor: '#da3633', borderWidth: 1.5, borderDash: [4, 4], pointRadius: 0 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: { legend: { labels: { color: '#8b949e', font: { size: 11 } } } },
                    scales: {
                        x: { grid: { color: '#30363d' }, ticks: { color: '#8b949e' } },
                        y: { grid: { color: '#30363d' }, ticks: { color: '#8b949e' } }
                    }
                }
            });
        }

        function updateHeaderTime() {
            document.getElementById("lastUpdate").innerText = `最後更新: ${new Date().toTimeString().split(' ')[0]}`;
        }

        function logEvent(msg) {
            const feed = document.getElementById("logFeed");
            const div = document.createElement("div");
            div.innerHTML = `<span style="color:var(--text-secondary)">[${new Date().toTimeString().split(' ')[0]}]</span> ${msg}`;
            feed.prepend(div);
        }
    </script>
</body>
</html>
