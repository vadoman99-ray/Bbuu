<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMC 永續合約極速掃描器</title>
  <style>
    :root {
      --bg-color: #121418;
      --card-bg: #1e222d;
      --text-color: #d1d4dc;
      --accent-green: #0ecb81;
      --accent-red: #f6465d;
      --border-color: #2a2e39;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
    }
    h1 { margin: 0; font-size: 1.5rem; color: #fff; }
    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
    }
    select, button {
      background: var(--card-bg);
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { border-color: var(--accent-green); background: #2a2e39; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }
    th { background: #161a25; color: #848e9c; font-weight: 600; }
    tr:hover { background: #262b3e; }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      display: inline-block;
    }
    .badge-bull { background: rgba(14, 203, 129, 0.15); color: var(--accent-green); }
    .badge-bear { background: rgba(246, 70, 93, 0.15); color: var(--accent-red); }
    .status { font-size: 0.9rem; color: #848e9c; min-height: 1.2em; }
    
    /* 進度條樣式 */
    .progress-bar {
      width: 100%;
      height: 4px;
      background: var(--border-color);
      margin-bottom: 15px;
      border-radius: 2px;
      overflow: hidden;
      display: none;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent-green);
      width: 0%;
      transition: width 0.1s ease;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>⚡ SMC 永續合約極速掃描器</h1>
    <div class="controls">
      <label>K線週期：
        <select id="timeframe">
          <option value="15m" selected>15 分鐘</option>
          <option value="1h">1 小時</option>
          <option value="4h">4 小時</option>
        </select>
      </label>
      <button id="scanBtn" onclick="startScan()">🚀 開始掃描</button>
    </div>
  </header>

  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
  <div style="margin-bottom: 10px;" class="status" id="statusText">點擊「開始掃描」即刻並行分析幣安熱門合約...</div>

  <table>
    <thead>
      <tr>
        <th>幣種名稱</th>
        <th>當前價格</th>
        <th>偵測訊號型態</th>
        <th>方向</th>
        <th>參考觀察區間</th>
      </tr>
    </thead>
    <tbody id="resultBody">
      <tr><td colspan="5" style="text-align: center; color: #848e9c;">暫無數據</td></tr>
    </tbody>
  </table>
</div>

<script>
  // 基礎網路請求封裝（帶有逾時處理）
  async function fetchWithTimeout(url, options = {}, timeout = 5000) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeout);
    try {
      const response = await fetch(url, { ...options, signal: controller.signal });
      clearTimeout(id);
      if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
      return await response.json();
    } catch (err) {
      clearTimeout(id);
      throw err;
    }
  }

  // 取得幣安 USDT 永續合約成交量前 30 名幣種
  async function getTopSymbols() {
    const data = await fetchWithTimeout('https://fapi.binance.com/fapi/1/ticker/24hr');
    return data
      .filter(item => item.symbol.endsWith('USDT'))
      .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
      .slice(0, 30)
      .map(item => item.symbol);
  }

  // 取得單一幣種的 K線數據
  async function getKlines(symbol, interval) {
    const data = await fetchWithTimeout(`https://fapi.binance.com/fapi/1/klines?symbol=${symbol}&interval=${interval}&limit=20`);
    return data.map(k => ({
      high: parseFloat(k[2]),
      low: parseFloat(k[3]),
      close: parseFloat(k[4]),
      open: parseFloat(k[1])
    }));
  }

  // SMC 策略邏輯判斷
  function analyzePattern(klines) {
    const len = klines.length;
    if (len < 5) return null;

    const k1 = klines[len - 3];
    const k2 = klines[len - 2];
    const k3 = klines[len - 1];

    // 1. FVG 價格缺口 (第6招)
    if (k1.high < k3.low) {
      return { pattern: 'FVG 價格缺口', type: '看多 (Bullish)', range: `${k1.high} - ${k3.low}` };
    }
    if (k1.low > k3.high) {
      return { pattern: 'FVG 價格缺口', type: '看空 (Bearish)', range: `${k3.high} - ${k1.low}` };
    }

    // 2. 流動性掠奪/假突破 (第1、2招)
    const prevHigh = Math.max(...klines.slice(len - 10, len - 2).map(k => k.high));
    const prevLow = Math.min(...klines.slice(len - 10, len - 2).map(k => k.low));

    if (k2.high > prevHigh && k2.close < prevHigh) {
      return { pattern: '假突破掠奪 (Sweep)', type: '看空 (Bearish)', range: `掃蕩點: ${k2.high}` };
    }
    if (k2.low < prevLow && k2.close > prevLow) {
      return { pattern: '假突破掠奪 (Sweep)', type: '看多 (Bullish)', range: `掃蕩點: ${k2.low}` };
    }

    return null;
  }

  // 極速掃描核心（併發處理）
  async function startScan() {
    const timeframe = document.getElementById('timeframe').value;
    const statusText = document.getElementById('statusText');
    const tbody = document.getElementById('resultBody');
    const scanBtn = document.getElementById('scanBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');

    // UI 狀態重置
    scanBtn.disabled = true;
    progressBar.style.display = 'block';
    progressFill.style.width = '0%';
    statusText.innerText = '正在獲取市場行情...';
    tbody.innerHTML = '';

    const startTime = performance.now();

    try {
      const symbols = await getTopSymbols();
      statusText.innerText = `已鎖定前 30 熱門幣種，並列分析中...`;

      let completedCount = 0;
      let foundCount = 0;

      // 建立所有幣種的併發任務
      const tasks = symbols.map(async (symbol) => {
        try {
          const klines = await getKlines(symbol, timeframe);
          const signal = analyzePattern(klines);

          completedCount++;
          // 更新進度條
          progressFill.style.width = `${(completedCount / symbols.length) * 100}%`;

          if (signal) {
            foundCount++;
            const currentPrice = klines[klines.length - 1].close;
            const isBull = signal.type.includes('看多');
            return `
              <tr>
                <td><strong>${symbol}</strong></td>
                <td>${currentPrice}</td>
                <td>${signal.pattern}</td>
                <td><span class="badge ${isBull ? 'badge-bull' : 'badge-bear'}">${signal.type}</span></td>
                <td>${signal.range}</td>
              </tr>
            `;
          }
        } catch (e) {
          console.warn(`幣種 ${symbol} 獲取失敗:`, e);
        }
        return '';
      });

      // 同步等待所有任務完成
      const results = await Promise.all(tasks);
      
      // 渲染畫面
      const htmlContent = results.join('');
      if (foundCount === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #848e9c;">當前時框未發現符合 SMC 型態的熱門幣種</td></tr>';
      } else {
        tbody.innerHTML = htmlContent;
      }

      const endTime = performance.now();
      const duration = ((endTime - startTime) / 1000).toFixed(2);
      statusText.innerText = `⚡ 掃描完畢！僅耗時 ${duration} 秒 | 發現 ${foundCount} 個潛在訊號。`;

    } catch (err) {
      console.error(err);
      statusText.innerText = '❌ 網路請求失敗，請檢查網路連線或 API 限制。';
    } finally {
      scanBtn.disabled = false;
      setTimeout(() => { progressBar.style.display = 'none'; }, 500);
    }
  }
</script>

</body>
</html>
