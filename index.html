<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMC 15m/1m 雙時間框架假突破掃描器</title>
  <style>
    :root {
      --bg-color: #121418;
      --card-bg: #1e222d;
      --text-color: #d1d4dc;
      --accent-green: #0ecb81;
      --accent-red: #f6465d;
      --border-color: #2a2e39;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
    }
    h1 { margin: 0; font-size: 1.25rem; color: #fff; }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button {
      background: var(--card-bg);
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { border-color: var(--accent-green); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .table-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
    }
    table { width: 100%; min-width: 650px; border-collapse: collapse; }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
    }
    th { background: #161a25; color: #848e9c; font-weight: 600; white-space: nowrap; }
    tr:hover { background: #262b3e; }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      display: inline-block;
      white-space: nowrap;
    }
    .badge-bull { background: rgba(14, 203, 129, 0.15); color: var(--accent-green); }
    .badge-bear { background: rgba(246, 70, 93, 0.15); color: var(--accent-red); }
    .status { font-size: 0.85rem; color: #848e9c; margin-bottom: 10px; min-height: 1.2em; }
    .price-tag { font-family: monospace; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🎯 15m/1m 雙框架假突破掃描器</h1>
    <div class="controls">
      <button id="scanBtn" onclick="startScan()">🚀 開始掃描雙框架訊號</button>
    </div>
  </header>

  <div class="status" id="statusText">點擊按鈕，掃描 15m 鎖定與 1m 精準進場訊號...</div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>幣種</th>
          <th>方向</th>
          <th>15m 觸發狀態</th>
          <th>1m 進場狀態</th>
          <th>參考進場價</th>
          <th>建議止損位</th>
        </tr>
      </thead>
      <tbody id="resultBody">
        <tr><td colspan="6" style="text-align: center; color: #848e9c;">暫無數據，請點擊上方按鈕開始分析</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // 代理池，防範 CORS 與 429 限流
  const PROXIES = [
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
  ];
  let proxyIndex = 0;
  const sleep = ms => new Promise(res => setTimeout(res, ms));

  async function fetchAPI(url) {
    for (let i = 0; i < PROXIES.length; i++) {
      try {
        const res = await fetch(PROXIES[proxyIndex](url));
        if (res.ok) return await res.json();
      } catch (e) {
        proxyIndex = (proxyIndex + 1) % PROXIES.length;
        await sleep(100);
      }
    }
    throw new Error('API 請求失敗');
  }

  // 獲取前 15 名永續合約熱門幣種
  async function getTopSymbols() {
    const data = await fetchAPI('https://fapi.binance.com/fapi/1/ticker/24hr');
    return data
      .filter(item => item.symbol.endsWith('USDT'))
      .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
      .slice(0, 15)
      .map(item => item.symbol);
  }

  // 獲取特定 timeframe 的 K 線數據
  async function getKlines(symbol, interval, limit = 20) {
    const data = await fetchAPI(`https://fapi.binance.com/fapi/1/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`);
    return data.map(k => ({
      high: parseFloat(k[2]),
      low: parseFloat(k[3]),
      close: parseFloat(k[4]),
      open: parseFloat(k[1])
    }));
  }

  // 檢測 Sweep（假突破掠奪）：突破前高/低點但收盤收回
  function checkSweep(klines) {
    const len = klines.length;
    if (len < 5) return null;

    const current = klines[len - 1]; // 最新收盤/當前 K 線
    const prevHigh = Math.max(...klines.slice(len - 12, len - 1).map(k => k.high));
    const prevLow = Math.min(...klines.slice(len - 12, len - 1).map(k => k.low));

    // 向上刺穿但收回（空單訊號）
    if (current.high > prevHigh && current.close < prevHigh) {
      return { type: 'Bearish', sweepPoint: current.high, entryPrice: current.close };
    }
    // 向下刺穿但收回（多單訊號）
    if (current.low < prevLow && current.close > prevLow) {
      return { type: 'Bullish', sweepPoint: current.low, entryPrice: current.close };
    }

    return null;
  }

  async function startScan() {
    const statusText = document.getElementById('statusText');
    const tbody = document.getElementById('resultBody');
    const scanBtn = document.getElementById('scanBtn');

    scanBtn.disabled = true;
    statusText.innerText = '正在初始化數據連線...';
    tbody.innerHTML = '';

    try {
      const symbols = await getTopSymbols();
      let foundCount = 0;

      for (let i = 0; i < symbols.length; i++) {
        const symbol = symbols[i];
        statusText.innerText = `正在分析雙時框型態 (${i + 1}/${symbols.length})：${symbol}...`;

        try {
          // 步驟 1：檢測 15 分鐘圖（大週期 Sweep）
          const klines15m = await getKlines(symbol, '15m', 15);
          const signal15m = checkSweep(klines15m);

          if (signal15m) {
            // 步驟 2：15m 條件觸發，切換檢測 1 分鐘圖（小週期 1m Sweep 精準確認）
            await sleep(150); // 防限流短暫停頓
            const klines1m = await getKlines(symbol, '1m', 15);
            const signal1m = checkSweep(klines1m);

            foundCount++;
            const isBull = signal15m.type === 'Bullish';
            const status1mText = signal1m ? '🔥 1m 同步出現掃蕩點（可即刻進場）' : '⏳ 1m 等待二次掃蕩訊號';
            
            const row = `
              <tr>
                <td><strong>${symbol}</strong></td>
                <td><span class="badge ${isBull ? 'badge-bull' : 'badge-bear'}">${isBull ? '看多 (Long)' : '看空 (Short)'}</span></td>
                <td>15m 區間 Sweep 已形成</td>
                <td>${status1mText}</td>
                <td class="price-tag">${signal1m ? signal1m.entryPrice : signal15m.entryPrice}</td>
                <td class="price-tag" style="color: var(--accent-red);">${signal15m.sweepPoint}</td>
              </tr>
            `;
            tbody.innerHTML += row;
          }
        } catch (e) {
          console.warn(`${symbol} 獲取失敗`, e);
        }

        await sleep(150); // 每批次停頓保護 API
      }

      if (foundCount === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #848e9c;">當前前 15 大幣種未發現符合 15m/1m 雙框架掃蕩的標的</td></tr>';
      }
      statusText.innerText = `掃描完成！發現 ${foundCount} 個符合 15m 假突破的潛在標的。`;

    } catch (err) {
      console.error(err);
      statusText.innerText = '❌ 掃描失敗，請稍後重試。';
    } finally {
      scanBtn.disabled = false;
    }
  }
</script>

</body>
</html>
